<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Soft sweet peach-pink cream -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBF9" />
      <stop offset="40%" stop-color="#FFF3F4" />
      <stop offset="100%" stop-color="#FFEBEF" />
    </linearGradient>
    
    <!-- Big Heart Gradient -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9EAF" />
      <stop offset="100%" stop-color="#FF5B7A" />
    </linearGradient>

    <!-- Drop shadows for depth -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#5a1c22" flood-opacity="0.12" />
    </filter>
    <filter id="characterShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7a4a4a" flood-opacity="0.10" />
    </filter>
  </defs>

  <!-- Squircle App Icon Frame -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)" stroke="#FFDCE3" stroke-width="4" />

  <!-- Background Glowing Soft Pink Heart -->
  <path d="M256,450 C256,450 100,340 100,210 C100,120 170,70 240,70 C256,70 256,85 256,85 C256,85 256,70 272,70 C342,70 412,120 412,210 C412,340 256,450 256,450 Z" fill="#FFE5EA" opacity="0.8" />

  <!-- Sparkling Golden Stars & Love Bubbles -->
  <!-- Left Top Sparkle -->
  <path d="M75,120 Q100,120 100,95 Q100,120 125,120 Q100,120 100,145 Q100,120 75,120 Z" fill="#FFB400" opacity="0.9" />
  <!-- Right Top Sparkle -->
  <path d="M385,90 Q405,90 405,70 Q405,90 425,90 Q405,90 405,110 Q405,90 385,90 Z" fill="#FFA3B1" opacity="0.9" />
  
  <!-- Left Small Floating Heart -->
  <path d="M65,240 C65,240 50,225 50,210 C50,200 58,194 66,194 C70,194 73,196 75,198 C77,196 80,194 84,194 C92,194 100,200 100,210 C100,225 65,240 65,240 Z" fill="#FF5E7E" opacity="0.8" transform="rotate(-15, 65, 240)" />
  <!-- Right Small Floating Heart -->
  <path d="M445,210 C445,210 430,195 430,180 C430,170 438,164 446,164 C450,164 453,166 455,168 C457,166 460,164 464,164 C472,164 480,170 480,180 C480,195 445,210 445,210 Z" fill="#FF8A9A" opacity="0.9" transform="rotate(15, 445, 210)" />

  <!-- MAIN CHARACTER GROUP: Cuddling & Holding a Huge Core Heart -->
  <g filter="url(#softShadow)">
    <!-- Giant Main Pink Heart -->
    <path d="M256,410 C256,410 140,320 140,220 C140,160 190,120 240,120 C256,120 256,125 256,125 C256,125 256,120 272,120 C322,120 372,160 372,220 C372,320 256,410 256,410 Z" fill="url(#heartGrad)" />
    <!-- White Inner Glow on Heart -->
    <path d="M256,385 C256,385 165,305 165,220 C165,180 198,145 240,145" fill="none" stroke="#FFF" stroke-width="6" stroke-linecap="round" opacity="0.45" />
  </g>

  <!-- Left Character: Zara (Beige Puppy) - Scaled up 1.7x to look nice and chunky -->
  <g filter="url(#characterShadow)" transform="translate(48, 115) scale(1.75)">
    <!-- Zara Face -->
    <path d="M20,40 C20,25 35,20 50,20 C65,20 80,25 80,40 C80,55 75,68 50,68 C25,68 20,55 20,40 Z" fill="#f3dac2" stroke="#5B3825" stroke-width="3.2" stroke-linejoin="round" />
    <!-- Zara Ears -->
    <path d="M23,28 C10,28 12,54 24,54 C30,54 28,42 28,36" fill="#f3dac2" stroke="#5B3825" stroke-width="3.2" stroke-linejoin="round" />
    <path d="M77,28 C90,28 88,54 76,54 C70,54 72,42 72,36" fill="#f3dac2" stroke="#5B3825" stroke-width="3.2" stroke-linejoin="round" />
    <!-- Zara Rosy Cheeks (Chubby Blush) -->
    <ellipse cx="32" cy="48" rx="8.5" ry="5.5" fill="#fca5a5" opacity="0.85" />
    <!-- Zara Eyes & Eyebrows (Cute determined puppy look) -->
    <path d="M37,36 Q40,33 43,36" fill="none" stroke="#5B3825" stroke-width="2.4" stroke-linecap="round" />
    <circle cx="42" cy="44" r="4" fill="#5B3825" />
    <circle cx="43.5" cy="42.5" r="1.2" fill="#FFFFFF" /> <!-- Sparkle inside eye -->
    
    <path d="M63,36 Q60,33 57,36" fill="none" stroke="#5B3825" stroke-width="2.4" stroke-linecap="round" />
    <circle cx="58" cy="44" r="4" fill="#5B3825" />
    <circle cx="59.5" cy="42.5" r="1.2" fill="#FFFFFF" /> <!-- Sparkle inside eye -->
    
    <!-- Zara Mouth -->
    <path d="M45,52 Q50,57 55,52" fill="none" stroke="#5B3825" stroke-width="2.8" stroke-linecap="round" />
    
    <!-- Zara Left Paw holding the center heart -->
    <path d="M68,58 C72,56 78,58 78,64 C78,70 70,72 66,66 Z" fill="#f3dac2" stroke="#5B3825" stroke-width="2.8" />
  </g>

  <!-- Right Character: Latte (White Puppy) - Scaled up 1.7x to look nice and chunky -->
  <g filter="url(#characterShadow)" transform="translate(222, 115) scale(1.75)">
    <!-- Latte Face -->
    <path d="M22,40 C22,25 35,20 50,20 C65,20 78,25 78,40 C78,55 72,68 50,68 C28,68 22,55 22,40 Z" fill="#ffffff" stroke="#5B3825" stroke-width="3.2" stroke-linejoin="round" />
    <!-- Latte Ears -->
    <path d="M23,28 C10,28 12,54 24,54 C30,54 28,42 28,36" fill="#ffffff" stroke="#5B3825" stroke-width="3.2" stroke-linejoin="round" />
    <path d="M77,28 C90,28 88,54 76,54 C70,54 72,42 72,36" fill="#ffffff" stroke="#5B3825" stroke-width="3.2" stroke-linejoin="round" />
    <!-- Latte Rosy Cheeks -->
    <ellipse cx="68" cy="48" rx="8.5" ry="5.5" fill="#fca5a5" opacity="0.85" />
    <!-- Latte Eyes & Eyebrows (Cute determined puppy look) -->
    <path d="M37,36 Q40,33 43,36" fill="none" stroke="#5B3825" stroke-width="2.4" stroke-linecap="round" />
    <circle cx="42" cy="44" r="4" fill="#5B3825" />
    <circle cx="43.5" cy="42.5" r="1.2" fill="#FFFFFF" /> <!-- Sparkle inside eye -->
    
    <path d="M63,36 Q60,33 57,36" fill="none" stroke="#5B3825" stroke-width="2.4" stroke-linecap="round" />
    <circle cx="58" cy="44" r="4" fill="#5B3825" />
    <circle cx="59.5" cy="42.5" r="1.2" fill="#FFFFFF" /> <!-- Sparkle inside eye -->
    
    <!-- Latte Mouth -->
    <path d="M45,52 Q50,57 55,52" fill="none" stroke="#5B3825" stroke-width="2.8" stroke-linecap="round" />

    <!-- Latte Right Paw holding the center heart -->
    <path d="M32,58 C28,56 22,58 22,64 C22,70 30,72 34,66 Z" fill="#ffffff" stroke="#5B3825" stroke-width="2.8" />
  </g>

  <!-- Sweet Sparkles Overlay at the Bottom -->
  <g transform="translate(230, 395)">
    <!-- Central Sweet Mini-Heart -->
    <path d="M26,10 C26,10 16,5 16,0 C16,-5 20,-9 24,-9 C26,-9 27,-8 28,-7 C29,-8 30,-9 32,-9 C36,-9 40,-5 40,0 C40,5 26,10 26,10 Z" fill="#FF3A5C" transform="scale(1)" filter="url(#softShadow)" />
  </g>
</svg>
